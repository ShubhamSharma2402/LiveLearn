<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Details | LiveLearn</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/darkmode.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Main Content -->
  <main class="container dashboard-content">
    <button class="btn-secondary" id="backBtn">← Back to Browse</button>

    <section class="session-details">
      <div class="session-header">
        <img id="sessionImage" src="" alt="Session Image" class="session-image" />
        <h2 id="sessionTitle">Session Title</h2>
        <span id="sessionCategory" class="category-badge">Category</span>
      </div>

      <div class="host-info">
        <img id="hostAvatar" class="host-avatar" alt="Host" />
        <span id="hostName">Host Name</span>
      </div>

      <div class="session-meta">
        <p>Duration: <span id="sessionDuration"></span></p>
        <p>Price: <span id="sessionPrice"></span></p>
        <p>Rating: <span id="sessionRating"></span> ⭐ (<span id="sessionStudents"></span> Students)</p>
      </div>

      <div class="session-description">
        <h3>Description</h3>
        <p id="sessionDescription"></p>
      </div>

      <button class="btn-primary" id="bookSessionBtn">Book Session</button>
    </section>

    <section class="reviews">
      <h3>Reviews</h3>
      <div id="reviewsContainer">
        <!-- JS will render reviews here -->
      </div>
    </section>
  </main>

  <!-- JS -->
  <script type="module" src="js/pages/sessionDetails.js"></script>
</body>
</html>
